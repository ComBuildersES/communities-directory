name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# `cancel-in-progress: false` serializa los deploys, y con ellos la asignación de IDs:
# dos merges seguidos no pueden reclamar el mismo id.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6
        with:
          # Necesario para poder commitear los IDs asignados sobre la rama, no sobre el SHA.
          ref: master
          # El token por defecto no dispara workflows con su push, que es justo lo que
          # queremos: este mismo run ya publica el resultado.
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.0.2'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Las propuestas llegan con `id: null` y el id se asigna aquí, antes del build, para
      # que la comunidad nueva se publique en ESTE deploy y no en el siguiente (issue #437).
      - name: Asignar IDs de comunidades pendientes
        id: assign
        run: node scripts/assign-community-ids.js

      - name: Commitear los IDs asignados
        if: steps.assign.outputs.assigned != ''
        env:
          SUMMARY: ${{ steps.assign.outputs.summary }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/communities/ public/data/communities.meta.json
          if git diff --cached --quiet; then
            echo "No hay cambios que commitear."
            exit 0
          fi
          git commit -m "chore(data): asignar IDs de comunidad ($SUMMARY) [skip ci]"
          # Si otro merge entró entre el checkout y ahora, rebasar y reintentar: los ficheros
          # por comunidad no conflictan, así que el rebase es limpio.
          for attempt in 1 2 3; do
            if git push origin HEAD:master; then
              exit 0
            fi
            echo "Push rechazado (intento $attempt); rebasando sobre master."
            git fetch origin master
            git rebase origin/master
          done
          echo "No se pudo publicar los IDs asignados tras 3 intentos." >&2
          exit 1

      # El hook de post-commit solo corre en los clones locales que han hecho `npm install`:
      # nada de lo que se mergea desde la web de GitHub (incluidas las propuestas de
      # comunidad) pasa por él. Esta es la red que garantiza que el changelog siempre
      # refleje lo publicado. Va después de asignar IDs para que las altas nuevas puedan
      # enlazar su ficha del directorio.
      - name: Regenerar CHANGELOG.md
        run: node scripts/generate-changelog.js

      - name: Commitear el CHANGELOG actualizado
        run: |
          if git diff --quiet -- CHANGELOG.md; then
            echo "El changelog ya estaba al día."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs: update changelog [skip ci]"
          # Mismo patrón que la asignación de IDs: si otro merge entró por medio, rebasar
          # y reintentar. CHANGELOG.md se regenera entero, así que el rebase puede
          # conflictar; en ese caso se descarta la versión local y se vuelve a generar.
          for attempt in 1 2 3; do
            if git push origin HEAD:master; then
              exit 0
            fi
            echo "Push rechazado (intento $attempt); rebasando sobre master."
            git fetch origin master
            if ! git rebase origin/master; then
              # El changelog se regenera entero desde el log, así que el conflicto se
              # resuelve volviéndolo a generar sobre el historial ya rebasado.
              node scripts/generate-changelog.js
              git add CHANGELOG.md
              GIT_EDITOR=true git rebase --continue || git rebase --abort
            fi
          done
          echo "No se pudo publicar el changelog tras 3 intentos." >&2
          exit 1

      - name: Build the project
        run: npm run build

      - name: Clean Pages artifact
        run: find dist -name ".DS_Store" -delete

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
